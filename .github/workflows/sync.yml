name: sync-nba-data
on:
  schedule: [{cron: "*/20 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python sync.py
      - run: |
          git config user.name "nba-sync"; git config user.email "sync@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "data sync" && git push)
